<body>
<iframe id="app" title="Samui Disc Golf – Play now" allow="fullscreen"></iframe>
<script>
  // The real app – or the TEST app with ?test at the end of the address (for trying things out)
  const REAL = 'https://script.google.com/macros/s/AKfycbyyEfrl2q0m-cO5RPbd9NgkKTF1zK56s_SxOWNBmvfNo3lt2Ds5Px7HHTHBSJcNp84LvQ/exec';

  const q = new URLSearchParams(location.search);
  const card = q.get('card') ? '?card=' + encodeURIComponent(q.get('card')) : '';
  document.getElementById('app').src = (q.has('test') ? TEST : REAL) + card;
</script>
