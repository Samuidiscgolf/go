  iframe { position: absolute; left: 0; width: 100%; border: 0; }
</style>

<body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbyyEfrl2q0m-cO5RPbd9NgkKTF1zK56s_SxOWNBmvfNo3lt2Ds5Px7HHTHBSJcNp84LvQ/exec?view=tv" title="Samui Disc Golf – Live" allow="fullscreen"></iframe>
<script>
  // BAR = height of Google's "created by a Google Apps Script user" line, pushed up out of sight.
  // Test another value with ?bar=30 at the end of the address.
  const DESKTOP = 0, PHONE = 0;
  const q = Number(new URLSearchParams(location.search).get('bar'));
  const bar = q >= 0 && location.search.indexOf('bar=') >= 0 ? q : (innerWidth > 700 ? DESKTOP : PHONE);
  const f = document.getElementById('app');
  f.style.top = (-bar) + 'px';
  f.style.height = 'calc(100% + ' + bar + 'px)';
</script>
</body>
